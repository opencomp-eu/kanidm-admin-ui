# Release pipeline: runs on every push to the `release` branch.
#
# Version comes from the `version` field in Cargo.toml:
#   - New version  -> creates a GitHub release `vX.Y.Z` and pushes the image
#                     tagged vX.Y.Z, latest, and sha-<commit> to ghcr.io.
#   - Same version -> updates the existing release and overwrites the image tags.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write # create/update GitHub releases
  packages: write # push images to ghcr.io

concurrency:
  group: release
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run backend tests
        run: cargo test --locked

      - name: Build frontend (includes tsc type check)
        working-directory: frontend
        run: npm ci && npm run build

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "Could not read version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:v${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Docker image:

            ```
            docker pull ${{ env.IMAGE }}:v${{ steps.version.outputs.version }}
            ```
